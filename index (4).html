<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Karma Diagnose — ICD-10 søk for karkirurgi</title>
<meta name="theme-color" content="#0F6B63">
<style>
  :root {
    --bg: #F0F4F3;
    --surface: #FFFFFF;
    --border: #DCE6E3;
    --text: #16211E;
    --text-soft: #5B6E68;
    --accent: #0F6B63;
    --accent-dark: #0A4F49;
    --accent-soft: #E4F0EE;
    --bidiag: #A9660A;
    --bidiag-soft: #FBF0E0;
    --i-code: #0F6B63;
    --t-code: #4A5A8A;
    --g-code: #7A5A8A;
    --m-code: #8A5A5A;
    --other-code: #5B6E68;
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }

  .brand-mark {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: var(--accent-dark);
  }

  .brand-sub {
    font-size: 12.5px;
    color: var(--text-soft);
  }

  .search-wrap {
    position: relative;
  }

  #q {
    width: 100%;
    font-size: 16.5px;
    padding: 13px 42px 13px 16px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s ease;
  }

  #q:focus {
    border-color: var(--accent);
  }

  #clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 20px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  #clear-btn:hover { background: var(--border); }

  main {
    flex: 1;
    padding: 14px 16px 40px;
  }

  .hint {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.5;
    padding: 34px 8px;
    text-align: center;
  }

  .hint b { color: var(--text); }

  .fallback-note {
    font-size: 12.5px;
    color: var(--bidiag);
    background: var(--bidiag-soft);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-bottom: 10px;
  }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .code-chip {
    font-weight: 700;
    font-size: 13.5px;
    padding: 2px 8px;
    border-radius: 6px;
    letter-spacing: 0.01em;
  }
  .code-chip.i { color: var(--i-code); background: var(--accent-soft); }
  .code-chip.t { color: var(--t-code); background: #ECEFF9; }
  .code-chip.g { color: var(--g-code); background: #F3ECF6; }
  .code-chip.m { color: var(--m-code); background: #F6ECEC; }
  .code-chip.other { color: var(--other-code); background: #EEF2F1; }

  .gruppe-label {
    font-size: 11.5px;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .term {
    font-size: 15.5px;
    line-height: 1.35;
    font-weight: 500;
  }

  .bidiag-row {
    margin-top: 7px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--bidiag);
    background: var(--bidiag-soft);
    padding: 3px 9px;
    border-radius: 999px;
  }

  footer {
    text-align: center;
    padding: 10px 16px 26px;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  @media (min-width: 480px) {
    .term { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-mark">Karma Diagnose</span>
      <span class="brand-sub">ICD-10 søk · karkirurgi</span>
    </div>
    <div class="search-wrap">
      <input id="q" type="text" inputmode="search" autocomplete="off" autocorrect="off"
             spellcheck="false" placeholder="Skriv diagnose, symptom eller kode …" autofocus>
      <button id="clear-btn" aria-label="Tøm søk">✕</button>
    </div>
  </header>
  <main>
    <div id="results"></div>
  </main>
  <footer>Karma Diagnose · under utvikling · ikke offisiell kilde, bekreft mot Helsedirektoratets kodeverk</footer>
</div>

<script>
// Karma-Diagnose søkemotor
// Implementerer: prefiks-antisipasjon, global normalisering (ord/frase/delstreng),
// termgrupper, OG-så-ELLER flerordssøk, søkeregler med vekt+bidiagnose, standard-sortering.

function buildEngine(data) {
  const WORD_SPLIT = /[\s,/\-.()]+/;

  function lower(s) { return (s || '').toLowerCase().trim(); }

  // --- 1. Fraseregler (frasesynonym_global): erstatt hele fraser i rå tekst, lengste først ---
  const fraseRegler = data.normaliseringsregler.filter(r => r.type === 'frasesynonym_global');
  const fraseErstatninger = [];
  for (const r of fraseRegler) {
    const terms = (r.par || r.termer || []).map(lower);
    if (terms.length < 2) continue;
    const canonical = terms[0];
    for (const t of terms.slice(1)) {
      fraseErstatninger.push({ variant: t, canonical });
    }
  }
  fraseErstatninger.sort((a, b) => b.variant.length - a.variant.length);

  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function applyFraseRegler(text) {
    let t = text;
    for (const { variant, canonical } of fraseErstatninger) {
      const re = new RegExp('\\b' + escapeRegex(variant) + '\\b', 'gi');
      // Legg til den kanoniske formen RETT ETTER originalen, i stedet for aa erstatte den -
      // slik bevares originalordet for prefiks-matching mens den kanoniske formen ogsaa blir soekbar.
      t = t.replace(re, match => match + ' ' + canonical);
    }
    return t;
  }

  // --- 2. Delstreng-regler (stavevariant_understreng): erstatt understreng overalt, f.eks. thromb->tromb ---
  const substrRegler = data.normaliseringsregler.filter(r => r.type === 'stavevariant_understreng');
  function applySubstrRegler(text) {
    let t = text;
    for (const r of substrRegler) {
      const [a, b] = (r.par || []).map(lower);
      if (!a || !b) continue;
      // kanoniser til den KORTESTE varianten (a antas kortest, f.eks. "tromb")
      const re = new RegExp(escapeRegex(b), 'gi');
      t = t.replace(re, a);
    }
    return t;
  }

  // --- 3. Ordregler (ordsynonym_global): utvid hvert ord med ALLE likeverdige varianter,
  // uten aa fjerne selve originalordet (viktig for at antisipasjon skal fungere paa
  // uansett hvilken variant kodeteksten opprinnelig bruker).
  const ordGruppeMap = new Map();
  for (const r of data.normaliseringsregler) {
    if (r.type !== 'ordsynonym_global') continue;
    const terms = (r.par || r.termer || []).map(lower);
    if (terms.length < 2) continue;
    for (const t of terms) ordGruppeMap.set(t, terms);
  }

  function tokenize(text) {
    return lower(text).split(WORD_SPLIT).filter(w => w.length > 0);
  }

  function canonicalizeWords(text) {
    let t = lower(text);
    t = applyFraseRegler(t);
    t = applySubstrRegler(t);
    const rawWords = tokenize(t);
    const utvidet = [];
    for (const w of rawWords) {
      utvidet.push(w);
      const gruppe = ordGruppeMap.get(w);
      if (gruppe) for (const g of gruppe) if (g !== w) utvidet.push(g);
    }
    return utvidet;
  }

  // --- 4. Tegn-varianter (æ/ae, ø/oe, å/aa) - kun brukt som FALLBACK på brukerens søk ---
  const tegnRegler = data.normaliseringsregler.filter(r => r.type === 'stavevariant_tegn');
  function tegnVarianter(query) {
    const varianter = [query];
    for (const r of tegnRegler) {
      const [special, digraf] = r.par; // f.eks. ['æ','ae']
      const nye = [];
      for (const v of varianter) {
        if (v.includes(digraf)) nye.push(v.split(digraf).join(special));
        if (v.includes(special)) nye.push(v.split(special).join(digraf));
      }
      varianter.push(...nye);
    }
    return [...new Set(varianter)];
  }

  // --- 5. Bygg søkbar ordliste per kode (inkl. termgruppe-referanser) ---
  const termgrupper = {};
  for (const tg of data.termgrupper) termgrupper[tg.id] = tg;

  function buildCodeIndex(entries) {
    return entries.map(c => {
      let text = c.term_no + ' ' + c.synonyms.join(' ');
      for (const tgId of (c.termgruppe_referanser || [])) {
        const tg = termgrupper[tgId];
        if (tg) text += ' ' + tg.kanonisk + ' ' + tg.synonymer.join(' ');
      }
      return { entry: c, words: canonicalizeWords(text) };
    });
  }

  const codeIndex = buildCodeIndex(data.codes);
  const adjIndex = buildCodeIndex(data.tilstotende_koder || []);
  const allIndex = codeIndex.concat(adjIndex);
  const codeByCode = {};
  for (const ci of allIndex) codeByCode[ci.entry.code] = ci.entry;

  // --- 6. Matching: prefiks-sjekk av ett query-ord mot en kodes ordliste ---
  function wordMatches(queryWord, codeWords) {
    return codeWords.some(w => w.startsWith(queryWord));
  }

  function matchCount(queryWords, codeWords) {
    return queryWords.filter(qw => wordMatches(qw, codeWords)).length;
  }

  // --- 7. Søkeregler (betinget logikk) ---
  // En termgruppe-term regnes som "trigget" på to måter:
  //  - ETT-ords term (f.eks. "TIA", "drypp"): krever et query-ord som er minst 3 tegn
  //    OG er prefiks til/av dette ordet.
  //  - FLER-ords term (f.eks. "transitorisk iskemisk anfall"): krever at ALLE ordene i
  //    frasen finnes et sted i søket - ett enkelt løsrevet ord (som "iskemisk") er IKKE nok.
  //    Dette hindrer at generiske enkeltord i en lang frase trigger regelen alene.
  function termTriggered(term, queryWordsCanon) {
    const words = canonicalizeWords(term);
    if (words.length === 0) return false;
    if (words.length === 1) {
      const w = words[0];
      return queryWordsCanon.some(qw => qw.length >= 3 && (w.startsWith(qw) || qw.startsWith(w)));
    }
    // flerords-frase: krev at hvert av frasens ord matches av MINST ett query-ord
    return words.every(fw => queryWordsCanon.some(qw => qw.length >= 3 && fw.startsWith(qw)));
  }

  function checkSokeregler(queryWordsCanon, queryRaw) {
    for (const regel of data.sokeregler) {
      const tg = termgrupper[regel.trigger_termgruppe];
      if (!tg) continue;
      const alleTermer = [tg.kanonisk, ...tg.synonymer];
      const triggerHit = alleTermer.some(term => termTriggered(term, queryWordsCanon));
      if (!triggerHit) continue;

      const modifiers = regel.krever_modifier_ord || [];
      if (modifiers.length > 0) {
        const modHit = modifiers.some(m => lower(queryRaw).includes(lower(m)));
        if (!modHit) continue;
      }
      return regel;
    }
    return null;
  }

  // --- 7b. Prioriteringsregler: dytt spesifikke koder oeverst ved gitte soekeord,
  // uten aa skjule andre treff (i motsetning til sokeregler, som erstatter hele lista).
  const prioriteringsregler = data.prioriteringsregler || [];
  function finnPrioritet(code, queryWordsCanon) {
    for (const regel of prioriteringsregler) {
      const triggerHit = regel.trigger_ord.some(t => {
        const tWords = canonicalizeWords(t);
        return tWords.every(tw => queryWordsCanon.some(qw => tw.startsWith(qw) || qw.startsWith(tw)));
      });
      if (!triggerHit) continue;
      const p = regel.prioriteringer.find(p => p.kode === code);
      if (p) return p.vekt;
    }
    return null;
  }

  // --- 8. Hovedsøk ---
  function search(queryRaw) {
    queryRaw = (queryRaw || '').trim();
    if (queryRaw.length < 2) return [];

    const queryWordsCanon = canonicalizeWords(queryRaw);
    if (queryWordsCanon.length === 0) return [];

    // 8a. Sjekk søkeregler først
    const regel = checkSokeregler(queryWordsCanon, queryRaw);
    if (regel) {
      return regel.resultat
        .slice()
        .sort((a, b) => (a.vekt || 99) - (b.vekt || 99) || a.kode.localeCompare(b.kode))
        .map(r => ({
          code: r.kode,
          entry: codeByCode[r.kode],
          bidiagnose: r.bidiagnose || null,
          kilde: 'sokeregel:' + regel.id
        }))
        .filter(r => r.entry);
    }

    // 8b. OG-logikk: krev at ALLE query-ord matcher
    let ogTreff = allIndex.filter(ci => queryWordsCanon.every(qw => wordMatches(qw, ci.words)));

    let brukteFallback = false;
    let treffListe = ogTreff;

    // 8c. Fallback: tegn-varianter paa hele spørringen hvis OG ga null treff
    if (treffListe.length === 0) {
      for (const variant of tegnVarianter(queryRaw)) {
        if (variant === queryRaw) continue;
        const varWords = canonicalizeWords(variant);
        const t = allIndex.filter(ci => varWords.every(qw => wordMatches(qw, ci.words)));
        if (t.length > 0) { treffListe = t; break; }
      }
    }

    // 8d. Fallback: ELLER-logikk rangert etter antall matchende ord
    if (treffListe.length === 0) {
      const scored = allIndex
        .map(ci => ({ ci, score: matchCount(queryWordsCanon, ci.words) }))
        .filter(x => x.score > 0);
      scored.sort((a, b) => b.score - a.score || a.ci.entry.code.localeCompare(b.ci.entry.code));
      treffListe = scored.map(x => x.ci);
      brukteFallback = true;
    } else {
      // 8e. Standard-sortering: prioriteringsregel (om noen) foerst, deretter kapittel-prioritet
      // (I foer T foer G foer M foer S foer andre), deretter relevans (hoy/middels/lav), deretter kodenummer.
      const relevansRang = { hoy: 0, middels: 1, lav: 2 };
      const kapittelRang = { I: 0, T: 1, G: 2, M: 3, S: 4 };
      treffListe = treffListe.slice().sort((a, b) => {
        const pa = finnPrioritet(a.entry.code, queryWordsCanon);
        const pb = finnPrioritet(b.entry.code, queryWordsCanon);
        if (pa !== null || pb !== null) {
          const va = pa === null ? 99 : pa;
          const vb = pb === null ? 99 : pb;
          if (va !== vb) return va - vb;
        }
        const ka = kapittelRang[a.entry.code[0]] ?? 9;
        const kb = kapittelRang[b.entry.code[0]] ?? 9;
        if (ka !== kb) return ka - kb;
        const ra = relevansRang[a.entry.relevans] ?? 1;
        const rb = relevansRang[b.entry.relevans] ?? 1;
        if (ra !== rb) return ra - rb;
        return a.entry.code.localeCompare(b.entry.code);
      });
    }

    return treffListe.map(ci => ({
      code: ci.entry.code,
      entry: ci.entry,
      bidiagnose: (ci.entry.bidiagnose_forslag && ci.entry.bidiagnose_forslag[0]) ?
        ci.entry.bidiagnose_forslag[0].kode : null,
      kilde: brukteFallback ? 'eller-fallback' : 'og-logikk'
    }));
  }

  return { search };
}


</script>

<script>
(function () {
  const data = JSON.parse(document.getElementById('karma-data').textContent);
  const engine = buildEngine(data);

  const qInput = document.getElementById('q');
  const resultsEl = document.getElementById('results');
  const clearBtn = document.getElementById('clear-btn');

  function chipClass(code) {
    if (code.startsWith('I')) return 'i';
    if (code.startsWith('T')) return 't';
    if (code.startsWith('G')) return 'g';
    if (code.startsWith('M')) return 'm';
    return 'other';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function render(query) {
    const trimmed = query.trim();
    clearBtn.style.display = trimmed.length > 0 ? 'flex' : 'none';

    if (trimmed.length < 2) {
      resultsEl.innerHTML = '<div class="hint">Skriv <b>minst 2 tegn</b> for å starte søket — f.eks. «claudicatio», «AAA», «carotisstenose».</div>';
      return;
    }

    const hits = engine.search(trimmed);

    if (hits.length === 0) {
      resultsEl.innerHTML = '<div class="hint">Ingen treff på «' + escapeHtml(trimmed) + '». Prøv et annet ord, en forkortelse, eller sjekk stavemåten.</div>';
      return;
    }

    const usedFallback = hits.length > 0 && hits[0].kilde === 'eller-fallback';
    let html = '';
    if (usedFallback) {
      html += '<div class="fallback-note">Ingen eksakte treff på alle ord — viser nærmeste treff, rangert etter antall matchende ord.</div>';
    }

    html += '<div class="result-list">';
    for (const h of hits) {
      const cls = chipClass(h.code);
      html += '<div class="card">';
      html += '  <div class="card-top">';
      html += '    <span class="code-chip ' + cls + ' mono">' + escapeHtml(h.code) + '</span>';
      if (h.entry.gruppe) {
        html += '    <span class="gruppe-label">' + escapeHtml(h.entry.gruppe) + '</span>';
      }
      html += '  </div>';
      html += '  <div class="term">' + escapeHtml(h.entry.term_no) + '</div>';
      if (h.bidiagnose) {
        html += '  <div class="bidiag-row">+ bidiagnose <span class="mono">' + escapeHtml(h.bidiagnose) + '</span></div>';
      }
      html += '</div>';
    }
    html += '</div>';
    resultsEl.innerHTML = html;
  }

  qInput.addEventListener('input', () => render(qInput.value));
  clearBtn.addEventListener('click', () => {
    qInput.value = '';
    qInput.focus();
    render('');
  });

  render('');
})();
</script>
