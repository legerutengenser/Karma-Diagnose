<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Karma Diagnose — ICD-10 søk for karkirurgi</title>
<meta name="theme-color" content="#0F6B63">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-180.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Karma Diagnose">
<style>
  :root {
    /* Fargene er beholdt fra Karma Diagnose (grønn/teal); oppsettet følger Karma Kode. */
    --bg: #F0F4F3;
    --panel: #FFFFFF;
    --ink: #16211E;
    --ink-soft: #5B6E68;
    --line: #DCE6E3;
    --accent: #0F6B63;
    --accent-dark: #0A4F49;
    --accent-soft: #E4F0EE;
    --bidiag: #A9660A;
    --bidiag-soft: #FBF0E0;
    --head-bg: #F6F9F8;
    --i-code: #0F6B63;
    --t-code: #4A5A8A;
    --g-code: #7A5A8A;
    --m-code: #8A5A5A;
    --other-code: #5B6E68;
    --mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    --serif: 'Source Serif Pro', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 22px; flex-wrap: wrap; gap: 8px;
  }
  header.top h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header.top h1 span { color: var(--accent); font-style: italic; }
  header.top .sub {
    font-size: 12.5px; color: var(--ink-soft); font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  .header-right { display: flex; align-items: center; gap: 14px; }
  .feedback-btn {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink); border: 1px solid var(--ink); border-radius: 3px; padding: 5px 10px;
    text-decoration: none; white-space: nowrap; background: transparent; cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .feedback-btn:hover { background: var(--ink); color: #fff; }

  .search-wrap { position: relative; margin-bottom: 18px; }
  .search-wrap input {
    width: 100%; font-size: 19px; font-family: var(--sans);
    padding: 16px 48px 16px 18px;
    border: 2px solid var(--ink); border-radius: 4px;
    background: var(--panel); color: var(--ink); outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #clear-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: transparent;
    color: var(--ink-soft); font-size: 20px; cursor: pointer;
    display: none; align-items: center; justify-content: center; border-radius: 50%;
  }
  #clear-btn:hover { background: var(--line); }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 22px; align-items: start; }
  @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .panel-head {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-soft); padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--head-bg); display: flex; justify-content: space-between; align-items: center;
  }

  .results { max-height: 640px; overflow-y: auto; }
  .result-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.12s;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row:hover { background: var(--accent-soft); }
  .result-row.selected { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }

  .r-code {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    background: var(--other-code); color: #fff;
    padding: 3px 7px; border-radius: 3px; flex-shrink: 0; min-width: 64px; text-align: center;
  }
  .r-code.i { background: var(--i-code); }
  .r-code.t { background: var(--t-code); }
  .r-code.g { background: var(--g-code); }
  .r-code.m { background: var(--m-code); }

  .r-text { flex: 1; min-width: 0; }
  .r-text .main { font-size: 14.5px; line-height: 1.3; }
  .r-text .meta {
    font-size: 11px; color: var(--ink-soft); font-family: var(--mono); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .r-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
  .badge { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .badge.bidiag { background: var(--bidiag-soft); color: var(--bidiag); }

  .fallback-note {
    font-size: 12.5px; color: var(--bidiag); background: var(--bidiag-soft);
    padding: 9px 14px; border-bottom: 1px solid var(--line);
  }
  .quote-box { padding: 48px 28px; text-align: center; }
  .quote-text { font-family: var(--serif); font-size: 24px; font-style: italic; color: var(--ink); line-height: 1.4; margin-bottom: 10px; }
  .quote-author { font-family: var(--mono, ui-monospace, monospace); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .quote-hint { margin-top: 28px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
  .empty-state .big { font-family: var(--serif); font-size: 22px; font-style: italic; color: var(--ink); margin-bottom: 6px; }
  .more-btn {
    display: block; width: calc(100% - 24px); margin: 10px 12px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 6px; background: transparent;
    color: inherit; font: inherit; cursor: pointer;
  }
  .more-btn:hover { background: var(--accent-soft); }

  /* Detaljboks */
  .detail-box { padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .detail-box .d-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .detail-box .dgruppe { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .detail-box .dtext { font-size: 15px; line-height: 1.4; margin-bottom: 10px; }
  .detail-box .dsyn { font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; margin-bottom: 10px; }
  .detail-box .dsyn b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .dbidiag {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--bidiag); background: var(--bidiag-soft);
    padding: 7px 10px; border-radius: 4px; margin-bottom: 10px;
  }
  .chip-link {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: #fff; background: var(--bidiag);
    border: none; border-radius: 3px; padding: 3px 7px; cursor: pointer;
  }
  .chip-link:hover { background: #8a5208; }
  .show-in-tree {
    display: none; font-family: var(--mono); font-size: 11.5px; background: var(--ink); color: #fff;
    border: none; padding: 8px 12px; border-radius: 3px; cursor: pointer;
  }
  .show-in-tree:hover { background: var(--accent); }

  /* Trevisning */
  .tree { max-height: 720px; overflow-y: auto; font-size: 13px; padding: 6px 0; }
  .tree-group { border-bottom: 1px solid var(--line); }
  .tree-group:last-child { border-bottom: none; }
  .tree-group-head {
    padding: 9px 14px; font-weight: 600; font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; background: var(--head-bg); user-select: none;
  }
  .tree-group-head:hover { background: var(--accent-soft); }
  .chev {
    font-family: var(--mono); font-size: 10px; color: var(--ink-soft); width: 14px;
    flex-shrink: 0; transition: transform 0.15s; text-align: center;
  }
  .tree-group.open > .tree-group-head .chev,
  .tree-sub.open > .tree-sub-head .chev { transform: rotate(90deg); }
  .tree-group-name { flex: 1; }
  .tree-group-count { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); font-weight: 400; }
  .tree-children, .tree-codes { display: none; }
  .tree-group.open > .tree-children, .tree-sub.open > .tree-codes { display: block; }

  .tree-sub-head, .tree-code-row {
    padding: 6px 14px; display: flex; gap: 8px; align-items: baseline;
    font-size: 12px; border-top: 1px solid #EDF2F0; cursor: pointer; user-select: none;
  }
  .tree-sub-head:hover, .tree-code-row:hover { background: var(--accent-soft); }
  .tcode { font-family: var(--mono); font-weight: 600; flex-shrink: 0; min-width: 52px; }
  .ttext { color: var(--ink-soft); line-height: 1.3; flex: 1; min-width: 0; }
  .tree-sub-head .ttext { color: var(--ink); }
  .highlight { background: #D9EFEA; animation: pulse 1.6s ease-out 2; }
  .highlight .tcode { color: var(--accent); }
  @keyframes pulse { 0%, 100% { background: #D9EFEA; } 50% { background: #B9DFD7; } }

  .legend {
    padding: 10px 16px; font-size: 11px; color: var(--ink-soft); display: flex; gap: 14px;
    flex-wrap: wrap; border-top: 1px solid var(--line); font-family: var(--mono);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
  .dot.i { background: var(--i-code); } .dot.t { background: var(--t-code); }
  .dot.g { background: var(--g-code); } .dot.m { background: var(--m-code); }
  .dot.other { background: var(--other-code); }

  footer.note {
    margin-top: 22px; font-size: 11.5px; color: var(--ink-soft);
    font-family: var(--mono); text-align: center; line-height: 1.5;
  }

  /* Mobil */
  @media (max-width: 640px) {
    .app { padding: 14px 12px 40px; }
    header.top { padding-bottom: 10px; margin-bottom: 14px; }
    header.top h1 { font-size: 22px; }
    header.top .sub { font-size: 10.5px; }
    .header-right { gap: 8px; flex-wrap: wrap; }
    .feedback-btn { padding: 6px 10px; }
    .search-wrap input { font-size: 17px; padding: 14px 44px 14px 16px; }
    .layout { gap: 14px; }
    .panel-head { padding: 9px 12px; font-size: 10.5px; }
    .results { max-height: 50vh; }
    .result-row { padding: 9px 12px; }
    .r-code { font-size: 12px; min-width: 56px; padding: 4px 6px; }
    .r-text .main { font-size: 15px; }
    .detail-box { padding: 13px 12px; }
    .show-in-tree { display: inline-block; width: 100%; padding: 10px 12px; }
    .tree { max-height: 60vh; }
    .tree-group-head { padding-top: 12px; padding-bottom: 12px; }
    .tree-sub-head, .tree-code-row { padding-top: 9px; padding-bottom: 9px; flex-wrap: wrap; }
    .tcode { min-width: 0; }
    .legend { padding: 10px 12px; gap: 10px; }
    footer.note { font-size: 10.5px; padding: 0 8px; }
  }
  @media (hover: none) {
    .result-row:hover, .tree-group-head:hover, .tree-sub-head:hover, .tree-code-row:hover { background: inherit; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Karma <span>Diagnose</span></h1>
    <div class="header-right">
      <div class="sub">Karkirurgi · ICD-10 · 2026</div>
      <button type="button" class="feedback-btn" id="feedbackBtn" hidden>Forslag</button>
    </div>
  </header>

  <div class="search-wrap">
    <input id="q" type="text" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="Søk: diagnose, symptom, forkortelse eller kode … (f.eks. «claudicatio», «AAA», «I70.2»)" autofocus>
    <button id="clear-btn" aria-label="Tøm søk">✕</button>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-head">
        <span>Treff</span>
        <span id="panelHeadInfo"></span>
      </div>
      <div id="detailBox"></div>
      <div class="results" id="results"></div>
    </div>

    <div class="panel" id="treePanel">
      <div class="panel-head">
        <span>Trevisning – ICD-10</span>
        <span id="treeInfo"></span>
      </div>
      <div class="tree" id="tree"></div>
      <div class="legend">
        <span><span class="dot i"></span> I Sirkulasjon</span>
        <span><span class="dot t"></span> T Komplikasjon</span>
        <span><span class="dot g"></span> G Nevrologi</span>
        <span><span class="dot m"></span> M Vaskulitt</span>
        <span><span class="dot other"></span> Annet</span>
      </div>
    </div>
  </div>

  <footer class="note">
    Karma Diagnose · under utvikling · ikke offisiell kilde, bekreft mot Helsedirektoratets kodeverk
  </footer>
</div>

<script>
// Karma-Diagnose søkemotor
// Implementerer: prefiks-antisipasjon, global normalisering (ord/frase/delstreng),
// termgrupper, OG-så-ELLER flerordssøk, søkeregler med vekt+bidiagnose, standard-sortering.

function buildEngine(data) {
  const WORD_SPLIT = /[\s,/\-.()]+/;

  function lower(s) { return (s || '').toLowerCase().trim(); }

  // --- 1. Fraseregler (frasesynonym_global): erstatt hele fraser i rå tekst, lengste først ---
  const fraseRegler = data.normaliseringsregler.filter(r => r.type === 'frasesynonym_global');
  const fraseErstatninger = [];
  for (const r of fraseRegler) {
    const terms = (r.par || r.termer || []).map(lower);
    if (terms.length < 2) continue;
    const canonical = terms[0];
    for (const t of terms.slice(1)) {
      fraseErstatninger.push({ variant: t, canonical });
    }
  }
  fraseErstatninger.sort((a, b) => b.variant.length - a.variant.length);

  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function applyFraseRegler(text) {
    let t = text;
    for (const { variant, canonical } of fraseErstatninger) {
      const re = new RegExp('\\b' + escapeRegex(variant) + '\\b', 'gi');
      // Legg til den kanoniske formen RETT ETTER originalen, i stedet for aa erstatte den -
      // slik bevares originalordet for prefiks-matching mens den kanoniske formen ogsaa blir soekbar.
      t = t.replace(re, match => match + ' ' + canonical);
    }
    return t;
  }

  // --- 2. Delstreng-regler (stavevariant_understreng): erstatt understreng overalt, f.eks. thromb->tromb ---
  const substrRegler = data.normaliseringsregler.filter(r => r.type === 'stavevariant_understreng');
  function applySubstrRegler(text) {
    let t = text;
    for (const r of substrRegler) {
      const [a, b] = (r.par || []).map(lower);
      if (!a || !b) continue;
      // kanoniser til den KORTESTE varianten (a antas kortest, f.eks. "tromb")
      const re = new RegExp(escapeRegex(b), 'gi');
      t = t.replace(re, a);
    }
    return t;
  }

  // --- 3. Ordregler (ordsynonym_global): utvid hvert ord med ALLE likeverdige varianter,
  // uten aa fjerne selve originalordet (viktig for at antisipasjon skal fungere paa
  // uansett hvilken variant kodeteksten opprinnelig bruker).
  const ordGruppeMap = new Map();
  for (const r of data.normaliseringsregler) {
    if (r.type !== 'ordsynonym_global') continue;
    const terms = (r.par || r.termer || []).map(lower);
    if (terms.length < 2) continue;
    for (const t of terms) ordGruppeMap.set(t, terms);
  }

  function tokenize(text) {
    return lower(text).split(WORD_SPLIT).filter(w => w.length > 0);
  }

  function canonicalizeWords(text) {
    let t = lower(text);
    t = applyFraseRegler(t);
    t = applySubstrRegler(t);
    const rawWords = tokenize(t);
    const utvidet = [];
    for (const w of rawWords) {
      utvidet.push(w);
      const gruppe = ordGruppeMap.get(w);
      if (gruppe) for (const g of gruppe) if (g !== w) utvidet.push(g);
    }
    return utvidet;
  }

  // --- 4. Tegn-varianter (æ/ae, ø/oe, å/aa) - kun brukt som FALLBACK på brukerens søk ---
  const tegnRegler = data.normaliseringsregler.filter(r => r.type === 'stavevariant_tegn');
  function tegnVarianter(query) {
    const varianter = [query];
    for (const r of tegnRegler) {
      const [special, digraf] = r.par; // f.eks. ['æ','ae']
      const nye = [];
      for (const v of varianter) {
        if (v.includes(digraf)) nye.push(v.split(digraf).join(special));
        if (v.includes(special)) nye.push(v.split(special).join(digraf));
      }
      varianter.push(...nye);
    }
    return [...new Set(varianter)];
  }

  // --- 5. Bygg søkbar ordliste per kode (inkl. termgruppe-referanser) ---
  const termgrupper = {};
  for (const tg of data.termgrupper) termgrupper[tg.id] = tg;

  function buildCodeIndex(entries) {
    return entries.map(c => {
      let text = c.term_no + ' ' + c.synonyms.join(' ');
      for (const tgId of (c.termgruppe_referanser || [])) {
        const tg = termgrupper[tgId];
        if (tg) text += ' ' + tg.kanonisk + ' ' + tg.synonymer.join(' ');
      }
      return { entry: c, words: canonicalizeWords(text) };
    });
  }

  const codeIndex = buildCodeIndex(data.codes);
  const adjIndex = buildCodeIndex(data.tilstotende_koder || []);
  const allIndex = codeIndex.concat(adjIndex);
  const codeByCode = {};
  for (const ci of allIndex) codeByCode[ci.entry.code] = ci.entry;

  // --- 6. Matching: prefiks-sjekk av ett query-ord mot en kodes ordliste ---
  function wordMatches(queryWord, codeWords) {
    return codeWords.some(w => w.startsWith(queryWord));
  }

  function matchCount(queryWords, codeWords) {
    return queryWords.filter(qw => wordMatches(qw, codeWords)).length;
  }

  // --- 7. Søkeregler (betinget logikk) ---
  // En termgruppe-term regnes som "trigget" på to måter:
  //  - ETT-ords term (f.eks. "TIA", "drypp"): krever et query-ord som er minst 3 tegn
  //    OG er prefiks til/av dette ordet.
  //  - FLER-ords term (f.eks. "transitorisk iskemisk anfall"): krever at ALLE ordene i
  //    frasen finnes et sted i søket - ett enkelt løsrevet ord (som "iskemisk") er IKKE nok.
  //    Dette hindrer at generiske enkeltord i en lang frase trigger regelen alene.
  function termTriggered(term, queryWordsCanon) {
    const words = canonicalizeWords(term);
    if (words.length === 0) return false;
    if (words.length === 1) {
      const w = words[0];
      return queryWordsCanon.some(qw => qw.length >= 3 && (w.startsWith(qw) || qw.startsWith(w)));
    }
    // flerords-frase: krev at hvert av frasens ord matches av MINST ett query-ord
    return words.every(fw => queryWordsCanon.some(qw => qw.length >= 3 && fw.startsWith(qw)));
  }

  function checkSokeregler(queryWordsCanon, queryRaw) {
    for (const regel of data.sokeregler) {
      const tg = termgrupper[regel.trigger_termgruppe];
      if (!tg) continue;
      const alleTermer = [tg.kanonisk, ...tg.synonymer];
      const triggerHit = alleTermer.some(term => termTriggered(term, queryWordsCanon));
      if (!triggerHit) continue;

      const modifiers = regel.krever_modifier_ord || [];
      if (modifiers.length > 0) {
        const modHit = modifiers.some(m => lower(queryRaw).includes(lower(m)));
        if (!modHit) continue;
      }
      return regel;
    }
    return null;
  }

  // --- 7b. Prioriteringsregler: dytt spesifikke koder oeverst ved gitte soekeord,
  // uten aa skjule andre treff (i motsetning til sokeregler, som erstatter hele lista).
  const prioriteringsregler = data.prioriteringsregler || [];
  function finnPrioritet(code, queryWordsCanon) {
    for (const regel of prioriteringsregler) {
      const triggerHit = regel.trigger_ord.some(t => {
        const tWords = canonicalizeWords(t);
        return tWords.every(tw => queryWordsCanon.some(qw => tw.startsWith(qw) || qw.startsWith(tw)));
      });
      if (!triggerHit) continue;
      const treffOrd = lst => lst.some(t => canonicalizeWords(t).every(tw =>
        queryWordsCanon.some(qw => qw.length >= 3 && (tw.startsWith(qw) || qw.includes(tw)))));
      if (regel.krever_ogsa_ord && !treffOrd(regel.krever_ogsa_ord)) continue;
      if (regel.ikke_hvis_ord && treffOrd(regel.ikke_hvis_ord)) continue;
      const p = regel.prioriteringer.find(p => p.kode === code);
      if (p) return p.vekt;
    }
    return null;
  }

  // --- 8. Hovedsøk ---
  function search(queryRaw) {
    queryRaw = (queryRaw || '').trim();
    if (queryRaw.length < 2) return [];

    const queryWordsCanon = canonicalizeWords(queryRaw);
    if (queryWordsCanon.length === 0) return [];

    // 8a. Sjekk søkeregler først
    const regel = checkSokeregler(queryWordsCanon, queryRaw);
    if (regel) {
      return regel.resultat
        .slice()
        .sort((a, b) => (a.vekt || 99) - (b.vekt || 99) || a.kode.localeCompare(b.kode))
        .map(r => ({
          code: r.kode,
          entry: codeByCode[r.kode],
          bidiagnose: r.bidiagnose || null,
          kilde: 'sokeregel:' + regel.id
        }))
        .filter(r => r.entry);
    }

    // 8b. OG-logikk: krev at ALLE query-ord matcher
    let ogTreff = allIndex.filter(ci => queryWordsCanon.every(qw => wordMatches(qw, ci.words)));

    let brukteFallback = false;
    let treffListe = ogTreff;

    // 8c. Fallback: tegn-varianter paa hele spørringen hvis OG ga null treff
    if (treffListe.length === 0) {
      for (const variant of tegnVarianter(queryRaw)) {
        if (variant === queryRaw) continue;
        const varWords = canonicalizeWords(variant);
        const t = allIndex.filter(ci => varWords.every(qw => wordMatches(qw, ci.words)));
        if (t.length > 0) { treffListe = t; break; }
      }
    }

    // 8d. Fallback: ELLER-logikk rangert etter antall matchende ord
    if (treffListe.length === 0) {
      const scored = allIndex
        .map(ci => ({ ci, score: matchCount(queryWordsCanon, ci.words) }))
        .filter(x => x.score > 0);
      scored.sort((a, b) => b.score - a.score || a.ci.entry.code.localeCompare(b.ci.entry.code));
      treffListe = scored.map(x => x.ci);
      brukteFallback = true;
    } else {
      // 8e. Standard-sortering: prioriteringsregel (om noen) foerst, deretter kapittel-prioritet
      // (I foer T foer G foer M foer S foer andre), deretter relevans (hoy/middels/lav), deretter kodenummer.
      const relevansRang = { hoy: 0, middels: 1, lav: 2 };
      const kapittelRang = { I: 0, T: 1, G: 2, M: 3, S: 4 };
      treffListe = treffListe.slice().sort((a, b) => {
        const pa = finnPrioritet(a.entry.code, queryWordsCanon);
        const pb = finnPrioritet(b.entry.code, queryWordsCanon);
        if (pa !== null || pb !== null) {
          const va = pa === null ? 99 : pa;
          const vb = pb === null ? 99 : pb;
          if (va !== vb) return va - vb;
        }
        const ka = kapittelRang[a.entry.code[0]] ?? 9;
        const kb = kapittelRang[b.entry.code[0]] ?? 9;
        if (ka !== kb) return ka - kb;
        const ra = relevansRang[a.entry.relevans] ?? 1;
        const rb = relevansRang[b.entry.relevans] ?? 1;
        if (ra !== rb) return ra - rb;
        return a.entry.code.localeCompare(b.entry.code);
      });
    }

    return treffListe.map(ci => ({
      code: ci.entry.code,
      entry: ci.entry,
      bidiagnose: (ci.entry.bidiagnose_forslag && ci.entry.bidiagnose_forslag[0]) ?
        ci.entry.bidiagnose_forslag[0].kode : null,
      kilde: brukteFallback ? 'eller-fallback' : 'og-logikk'
    }));
  }

  return { search };
}

  "sokeregler_readme": "Feltet \"vekt\" angir rangering naar et soek gir flere treff samtidig - lavest tall vises oeverst/tyngst. Flere koder kan dele samme vekt (vises da i vilkaarlig eller alfabetisk rekkefolge seg imellom). Feltet \"forrang_lavere_enn\" (kun paa regler som kan overlappe) angir at denne regelen kun skal brukes hvis ingen av de nevnte reglene med hoyere forrang trigges foerst (f.eks. hvis brukeren skriver \"symptomatisk\" skal ikke det noytrale 4-treffs-svaret vises i tillegg). Dette prinsippet - flere rangerte treff for samme soekeord - er tenkt gjenbrukt for andre soekeord (f.eks. \"aortaaneurisme\") naar Simen spesifiserer vekting/kombinasjoner for disse.",
  "standard_sortering": "Naar flere koder gir treff paa samme soekeord, og det IKKE finnes en egen \"sokeregel\" med definert \"vekt\" for akkurat det soeket, skal treffene vises i stigende kodenummer-rekkefolge (samme rekkefolge som i den offisielle Helsedirektoratet-lista). Dette er en midlertidig standardregel inntil Simen definerer spesifikk vekting for flere soekeord (f.eks. aortaaneurisme-gruppen).",
  "sokelogikk_flerordssok": "HYBRID OG/ELLER-logikk (revidert etter diskusjon med Simen): naar brukeren skriver flere ord, proev foerst streng OG-logikk (krev at ALLE ordene finnes for en kode - se tidligere eksempel med \"disseksjon a. radialis\" -> kun I72.1). HVIS DETTE GIR NULL TREFF, fall automatisk tilbake til ELLER-logikk: vis koder som treffer paa MINST ETT av ordene, rangert etter hvor mange av ordene som faktisk matcher (flest matchende ord = hoyest opp). Dette sikrer presise treff naar vi har tenkt paa riktig synonym, uten aa noensinne gi \"ingen treff\" naar brukeren bruker et ord vi ikke har forutsett. De eksplisitte \"sokeregler\" (som carotisstenose-logikken) er fortsatt unntak, styrt av sin egen logikk.",
  "normaliseringsregler_readme_tillegg": "Siden OG-logikken (se sokelogikk_flerordssok) sjekker paa tvers av HELE kodens tekst (kodetekst + alle synonymer samlet, ikke bare innad i en enkelt synonym-streng), holder det aa liste kar-navn/lokasjoner som egne, korte synonymer naar ordet \"aneurisme\"/\"disseksjon\" allerede finnes i kodeteksten (gjelder alle I72.x-koder). Kombinerte fraser som \"aneurisme X\" er derfor unngaatt fra og med denne opprydningen - MED UNNTAK av sammensatte norske ett-ords-varianter (f.eks. \"radialisaneurisme\"), som fortsatt legges inn separat siden de er ett eget soekbart ord.",

<script>
(function () {

  const engine = buildEngine(data);

  const BY_CODE = new Map(ALL.map(c => [c.code, c]));

  const qInput = document.getElementById('q');

  function chipClass(code) {
    const c = code.charAt(0);
    if (c === 'I') return 'i';
    if (c === 'T') return 't';
    if (c === 'G') return 'g';
    if (c === 'M') return 'm';
    return 'other';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  let lastSentSearch = '', searchLogTimer = null;
  function sendSearchToGoatCounter(query) {
    const q = (query || '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 40);
    if (q.length < 3 || q === lastSentSearch) return;
    lastSentSearch = q;
    try {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        window.goatcounter.count({ path: 'sok/' + q, title: q, event: true });
      }
    } catch (err) { /* statistikk skal aldri ødelegge appen */ }
  }

  // ---------------------------------------------------------------------

  const QUOTES = [

    { text: "Og det gikk opp for seint at at eg faktisk hadde skjært av meg armen min for å holde deg", author: "John Olav Nilsen & Gjengen" },
    { text: "Da har du problemer i følge peanøtthjerneforbundet", author: "Jokke" },

    { text: "Vi skulle redde verden, nå er de redde oss", author: "Karpe" },

    { text: "Something in the way she moves attracts me like no other lover", author: "The Beatles" },
    { text: "Ja det er sannelig flaks at du lever min venn", author: "Erik Bye" },

    { text: "At jeg elsker henne fortsatt, vel det bør jeg nå ha glemt", author: "deLilllos" },

    { text: "Every little thing is gonna be alright", author: "Bob Marley" },

    { text: "A friend in need is a friend indeed, a friend with weed is better", author: "Placebo" },

    { text: "Ground control to major Tom, your circuit´s dead, there´s something wrong", author: "David Bowie" },
    { text: "If they were right I´d agree, but it´s them they know, not me", author: "Cat Stevens" },
    { text: "There's still time to change the road you're on", author: "Led Zeppelin" },

    { text: "It hurts to set you free", author: "The Doors" },

    { text: "Well, it´s love that I need" , author: "Sublime" },
  ];

  const QUOTE_HISTORY_KEY = 'karkode_diagnose_quote_v1';
  function getRandomQuote() {
    let last = -1;
    try { last = JSON.parse(localStorage.getItem(QUOTE_HISTORY_KEY) || '{}').lastIndex; } catch (e) {}
    const cand = QUOTES.map((_, i) => i).filter(i => i !== last);
    const idx = cand[Math.floor(Math.random() * cand.length)];
    try { localStorage.setItem(QUOTE_HISTORY_KEY, JSON.stringify({ lastIndex: idx })); } catch (e) {}
    return QUOTES[idx];
  }
  const START_QUOTE = getRandomQuote();

  function renderResults() {
    const trimmed = currentQuery.trim();
    clearBtn.style.display = trimmed.length > 0 ? 'flex' : 'none';

    if (trimmed.length < 2) {
      currentHits = [];
      headInfoEl.textContent = '';
      resultsEl.innerHTML = '<div class="quote-box"><div class="quote-text">«' + escapeHtml(START_QUOTE.text) + '»</div>' +
        '<div class="quote-author">— ' + escapeHtml(START_QUOTE.author) + '</div>' +
        '<div class="quote-hint">Skriv minst 2 tegn, f.eks. «claudicatio», «AAA» eller «carotisstenose» — eller velg en diagnose i trevisningen.</div></div>';
      return;
    }

    currentHits = engine.search(trimmed);

    if (currentHits.length === 0) {
      headInfoEl.textContent = '0 treff';
      resultsEl.innerHTML = '<div class="empty-state"><div class="big">Ingen treff</div>' +
        'Ingen treff på «' + escapeHtml(trimmed) + '». Prøv et annet ord, en forkortelse, eller sjekk stavemåten.</div>';
      return;
    }

    headInfoEl.textContent = currentHits.length + (currentHits.length === 1 ? ' treff' : ' treff');
    const usedFallback = currentHits[0].kilde === 'eller-fallback';
    let html = '';
    if (usedFallback) {
      html += '<div class="fallback-note">Ingen eksakte treff på alle ord — viser nærmeste treff, rangert etter antall matchende ord.</div>';
    }
    const visible = currentHits.slice(0, shown);
    for (const h of visible) {
      html += '<div class="result-row' + (h.code === selectedCode ? ' selected' : '') + '" data-code="' + escapeHtml(h.code) +
              '" role="button" tabindex="0">' +
        '<span class="r-code ' + chipClass(h.code) + '">' + escapeHtml(h.code) + '</span>' +
        '<div class="r-text"><div class="main">' + escapeHtml(h.entry.term_no) + '</div>' +
        (h.entry.gruppe ? '<div class="meta">' + escapeHtml(h.entry.gruppe) + '</div>' : '') + '</div>' +
        (h.bidiagnose ? '<div class="r-badges"><span class="badge bidiag">+ ' + escapeHtml(h.bidiagnose) + '</span></div>' : '') +
        '</div>';
    }
    if (currentHits.length > shown) {
      html += '<button type="button" class="more-btn" id="moreBtn">Vis flere (' + (currentHits.length - shown) + ' igjen)</button>';
    }
    resultsEl.innerHTML = html;
  }

  function markSelectedResult() {
    resultsEl.querySelectorAll('.result-row').forEach(r =>
      r.classList.toggle('selected', r.getAttribute('data-code') === selectedCode));
  }

  // ---------------------------------------------------------------------
  // Detaljboks
  // ---------------------------------------------------------------------
  function renderDetail(code) {
    const e = BY_CODE.get(code);
    if (!e) { detailEl.innerHTML = ''; return; }
    let html = '<div class="detail-box">' +
      '<div class="d-top"><span class="r-code ' + chipClass(code) + '">' + escapeHtml(code) + '</span>' +
      (e.gruppe ? '<span class="dgruppe">' + escapeHtml(e.gruppe) + '</span>' : '') + '</div>' +
      '<div class="dtext">' + escapeHtml(e.term_no) + '</div>';
    if (e.synonyms && e.synonyms.length) {
      html += '<div class="dsyn"><b>Søkeord:</b> ' + e.synonyms.map(escapeHtml).join(' · ') + '</div>';
    }
    const bi = (e.bidiagnose_forslag || []).filter(b => b && b.kode);
    for (const b of bi) {
      const be = BY_CODE.get(b.kode);
      html += '<div class="dbidiag"><span>Foreslått bidiagnose</span>' +
        '<button type="button" class="chip-link" data-code="' + escapeHtml(b.kode) + '">' + escapeHtml(b.kode) + '</button>' +
        (be ? '<span>' + escapeHtml(be.term_no) + '</span>' : '') +
        (b.styrke ? '<span>(' + escapeHtml(b.styrke) + ')</span>' : '') + '</div>';
    }
    html += '<button type="button" class="show-in-tree" id="showInTree">Vis i trevisning ↓</button></div>';
    detailEl.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Trevisning (bygges fra kodelisten: gruppe → kode → undergruppe)
  // ---------------------------------------------------------------------
  function splitGroup(g) {
    const m = (g || '').match(/^([A-Z]\d{2})\s+(.*)$/);
    return m ? { key: m[1], name: m[2] } : { key: '', name: g || 'Andre' };
  }

  function buildTree() {
    const groups = new Map();
    for (const c of ALL) {
      if (!groups.has(c.gruppe)) groups.set(c.gruppe, []);
      groups.get(c.gruppe).push(c);
    }
    const list = Array.from(groups.entries()).map(([g, codes]) => {
      codes.sort((a, b) => (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));
      return { gruppe: g, codes };
    });
    list.sort((a, b) => (a.codes[0].code < b.codes[0].code ? -1 : 1));

    function nest(codes) {
      const roots = [], stack = [];
      for (const c of codes) {
        const node = { c, kids: [] };
        while (stack.length && !c.code.startsWith(stack[stack.length - 1].c.code)) stack.pop();
        (stack.length ? stack[stack.length - 1].kids : roots).push(node);
        stack.push(node);
      }
      return roots;
    }
    function countNodes(n) { return 1 + n.kids.reduce((s, k) => s + countNodes(k), 0); }
    function nodeHtml(n, depth) {
      const pad = 14 + depth * 16;
      const code = escapeHtml(n.c.code);
      const inner = '<span class="tcode">' + code + '</span><span class="ttext">' + escapeHtml(n.c.term_no) + '</span>';
      if (!n.kids.length) {
        return '<div class="tree-code-row" data-code="' + code + '" role="button" tabindex="0" style="padding-left:' + (pad + 14) + 'px">' + inner + '</div>';
      }
      const cnt = n.kids.reduce((s, k) => s + countNodes(k), 0);
      return '<div class="tree-sub">' +
        '<div class="tree-sub-head" data-code="' + code + '" role="button" tabindex="0" style="padding-left:' + pad + 'px">' +
        '<span class="chev">▶</span>' + inner + '<span class="tree-group-count">' + cnt + '</span></div>' +
        '<div class="tree-codes">' + n.kids.map(k => nodeHtml(k, depth + 1)).join('') + '</div></div>';
    }

    let html = '';
    for (const g of list) {
      const sg = splitGroup(g.gruppe);
      const first = g.codes[0].code, last = g.codes[g.codes.length - 1].code;
      const label = sg.key ? sg.key + ' — ' + sg.name
        : (first.slice(0, 3) === last.slice(0, 3) ? first.slice(0, 3) : first.slice(0, 3) + '–' + last.slice(0, 3)) + ' — ' + sg.name;
      html += '<div class="tree-group"><div class="tree-group-head" role="button" tabindex="0">' +
        '<span class="chev">▶</span><span class="tree-group-name">' + escapeHtml(label) + '</span>' +
        '<span class="tree-group-count">' + g.codes.length + '</span></div>' +
        '<div class="tree-children">' + nest(g.codes).map(n => nodeHtml(n, 0)).join('') + '</div></div>';
    }
    treeEl.innerHTML = html;
    treeInfoEl.textContent = ALL.length + ' koder';
  }

  function revealInTree(code, scrollTree) {
    const el = treeEl.querySelector('[data-code="' + code + '"]');
    if (!el) return;
    let p = el.parentElement;
    while (p && p !== treeEl) {
      if (p.classList.contains('tree-group') || p.classList.contains('tree-sub')) p.classList.add('open');
      p = p.parentElement;
    }
    treeEl.querySelectorAll('.highlight').forEach(r => r.classList.remove('highlight'));
    el.classList.add('highlight');
    if (scrollTree) {
      const cr = treeEl.getBoundingClientRect(), rr = el.getBoundingClientRect();
      treeEl.scrollTo({ top: treeEl.scrollTop + (rr.top - cr.top) - cr.height / 2 + rr.height / 2, behavior: 'smooth' });
    }
  }

  // ---------------------------------------------------------------------
  // Valg av diagnose (fra treff, tre eller bidiagnose)
  // ---------------------------------------------------------------------
  function selectCode(code) {
    if (!BY_CODE.has(code)) return;
    selectedCode = code;
    renderDetail(code);
    markSelectedResult();
    revealInTree(code, true);
  }

  resultsEl.addEventListener('click', ev => {
    if (ev.target.closest('#moreBtn')) { shown += PAGE; renderResults(); return; }
    const row = ev.target.closest('.result-row');
    if (row) selectCode(row.getAttribute('data-code'));
  });
  detailEl.addEventListener('click', ev => {
    const chip = ev.target.closest('.chip-link');
    if (chip) { selectCode(chip.getAttribute('data-code')); return; }
    if (ev.target.closest('#showInTree')) {
      document.getElementById('treePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  treeEl.addEventListener('click', ev => {
    const chev = ev.target.closest('.chev');
    const gh = ev.target.closest('.tree-group-head');
    if (gh) { gh.parentElement.classList.toggle('open'); return; }
    const sh = ev.target.closest('.tree-sub-head');
    if (sh) {
      if (chev) { sh.parentElement.classList.toggle('open'); return; }
      sh.parentElement.classList.add('open');
      selectCode(sh.getAttribute('data-code'));
      return;
    }
    const row = ev.target.closest('.tree-code-row');
    if (row) selectCode(row.getAttribute('data-code'));
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const t = ev.target;
    if (t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName === 'DIV') {
      ev.preventDefault(); t.click();
    }
  });

  qInput.addEventListener('input', () => {
    currentQuery = qInput.value; shown = PAGE; renderResults();
    // Anonym søkestatistikk (GoatCounter): kun etter 800 ms pause, >= 3 tegn, maks 40 tegn,
    // aldri samme term to ganger på rad. Ingen bruker-ID sendes.
    if (searchLogTimer) clearTimeout(searchLogTimer);
    const toLog = currentQuery;
    searchLogTimer = setTimeout(() => sendSearchToGoatCounter(toLog), 800);
  });
  clearBtn.addEventListener('click', () => {
    qInput.value = ''; currentQuery = ''; shown = PAGE; qInput.focus(); renderResults();
  });

  // «Forslag»-knappen åpner Google Forms.
  //  - url: skjemaets offentlige adresse (…/forms/d/e/<id>/viewform)
  //  - queryField / codeField (valgfritt): «entry.123456789» for feltene «Ønsket søkeord» og
  //    «Ønsket diagnosekode». Fylles ut med gjeldende søk og valgt kode.
  //  - choiceField + choiceValue (valgfritt): flervalgsspørsmålet og teksten på alternativet
  //    «Søkeord og ønsket diagnosekode». Forhåndsvelges bare når brukeren har søkt eller valgt en kode.
  // entry-numrene hentes fra «Få forhåndsutfylt lenke» i Google Forms. Er url tom, skjules knappen.
  const FEEDBACK = {
    url: 'https://docs.google.com/forms/d/e/1FAIpQLScIOu8JEPq41IOgMza4xJwIF4KVNS-EIG-93Yo_vV0hoN0aVA/viewform',
    queryField: '', codeField: '', choiceField: '', choiceValue: ''
  };
  const feedbackBtn = document.getElementById('feedbackBtn');
  if (feedbackBtn && FEEDBACK.url) {
    feedbackBtn.hidden = false;
    feedbackBtn.addEventListener('click', () => {
      const params = new URLSearchParams();
      const q = currentQuery.trim();
      if (FEEDBACK.queryField && q) params.set(FEEDBACK.queryField, q);
      if (FEEDBACK.codeField && selectedCode) params.set(FEEDBACK.codeField, selectedCode);
      if (FEEDBACK.choiceField && FEEDBACK.choiceValue && (q || selectedCode)) params.set(FEEDBACK.choiceField, FEEDBACK.choiceValue);
      const qs = params.toString();
      window.open(FEEDBACK.url + (qs ? '?usp=pp_url&' + qs : ''), '_blank', 'noopener');
    });
  }

  buildTree();
  renderResults();
})();
